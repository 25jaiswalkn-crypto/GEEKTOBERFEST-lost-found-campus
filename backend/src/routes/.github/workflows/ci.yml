name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          npm ci || npm install

      - name: Run Backend Tests
        run: |
          npm test --if-present

      - name: Build Frontend
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci || npm install
            npm run build
          fi